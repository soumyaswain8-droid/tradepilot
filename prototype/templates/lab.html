<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TradePilot Terminal — Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/desk.css">
<style>
  /* /lab on desk.css tokens (2026-09-05 reskin). The JS paints with --amb, so
     it is aliased here rather than edited. */
  :root{ --amb:var(--amber); --cy:var(--acc); --grn:var(--green); --faint:var(--dim); --jbm:"JetBrains Mono",var(--mono); }
  body{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--mut)}

  .top{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1.2px;font-size:11.5px;text-transform:uppercase}
  .brand .pulse{width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .beta{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--amber);background:var(--amber-bg);padding:2px 7px;border-radius:3px;text-transform:uppercase}
  .sub{color:var(--mut);font-size:11.5px}
  #upd{font-family:var(--jbm)}

  .sessions{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel2);overflow-x:auto;scrollbar-width:none}
  .sessions::-webkit-scrollbar{display:none}
  .slbl{font-size:10px;letter-spacing:.9px;color:var(--dim);text-transform:uppercase;white-space:nowrap;font-weight:700}
  .chips{display:flex;gap:6px}
  .sessions .chip{display:flex;align-items:baseline;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:4px;cursor:pointer;
    background:var(--panel);color:var(--mut);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap}
  .sessions .chip:hover{color:var(--ink);border-color:var(--line2)}
  .sessions .chip.on{border-color:var(--acc);background:var(--acc-bg);color:var(--ink)}
  .chip .cd{font-family:var(--jbm);font-size:11px;font-weight:600;color:var(--ink)} .chip .cp{font-family:var(--jbm);font-size:10px}
  .chip.live .cd{color:var(--green)}

  .wrap{padding:14px 16px 40px;max-width:1560px;margin:0 auto}
  .exp{margin-bottom:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
  .exp .eh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .exp .et{font-size:13px;font-weight:700}
  .exp .hyp{color:var(--mut);font-size:11.5px}
  .status{font-size:10px;font-weight:700;letter-spacing:.8px;padding:2px 7px;border-radius:3px;color:var(--amber);background:var(--amber-bg);text-transform:uppercase}
  .cmp{display:grid;grid-template-columns:1fr 150px 1fr;align-items:stretch}
  .cmp .card{background:transparent;border:0;border-radius:0;padding:14px 16px;min-width:0}
  .cmp .card.ch{border-right:1px solid var(--line)} .cmp .card.bl{border-left:1px solid var(--line)}
  .card .name{font-size:10.5px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pnl{font-family:var(--jbm);font-size:28px;font-weight:700;line-height:1;letter-spacing:-.4px}
  .meta{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
  .meta b{color:var(--ink);font-weight:600;font-family:var(--jbm)}
  .delta{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);gap:3px;padding:10px}
  .delta .d{font-family:var(--jbm);font-size:18px;font-weight:700} .delta .l{font-size:9.5px;letter-spacing:.9px;color:var(--dim);text-transform:uppercase;text-align:center}
  .gate{font-size:10px;padding:1px 6px;border-radius:3px;letter-spacing:.4px;text-transform:none;font-weight:600}
  .gate.ok{color:var(--green);background:var(--green-bg)} .gate.bad{color:var(--red);background:var(--red-bg)}
  .sdate{font-size:10px;color:var(--mut);font-family:var(--jbm);letter-spacing:0;text-transform:none;font-weight:400}
  .card.stale{outline:1px solid rgba(240,169,59,.4)}
  .stale-banner{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(240,169,59,.35);border-radius:3px;padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:.6px;margin-bottom:10px;text-align:center}
  .wait{color:var(--dim);font-style:italic;font-size:12px;padding:14px 0}
  .foot{margin:0;padding:10px 16px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;gap:20px;flex-wrap:wrap}
  .foot .r{margin-left:auto}
  @media (max-width:900px){.cmp{grid-template-columns:1fr}.cmp .card.ch,.cmp .card.bl{border:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
{% set current = 'lab' %}
{% include "_operator_nav.html" %}
  <div class="top">
    <div class="brand"><span class="pulse"></span> Lab</div>
    <span class="beta">◇ Beta / Testing</span>
    <span class="sub">A/B experiments — challenger vs live, in one place</span>
    <span class="sub" style="margin-left:auto" id="upd">—</span>
  </div>
  <div class="sessions">
    <span class="slbl">◷ Sessions · 1w</span>
    <div class="chips" id="chips"></div>
  </div>
  <div class="wrap" id="exps"></div>
  <div class="foot">
    <span>auto-refresh <b style="color:var(--ink)">10s</b></span>
    <span id="date-note"></span>
    <span class="r">v0.1 · lab · folds the :8899 A/B view into the app · Sarathi</span>
  </div>

<script>
const Q=new URLSearchParams(location.search);
// Validate ?date= to strict YYYY-MM-DD (else null) — prevents reflected XSS via
// date-note innerHTML and param injection into the fetch URL.
let VIEW=(function(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')?d:null;})(Q.get('date'));
const apiUrl=()=>'/api/lab'+(VIEW?('?date='+VIEW):'');
const inr=n=>(n>0?'+':n<0?'−':'')+'₹'+Math.abs(Math.round(n||0)).toLocaleString('en-IN');
const cls=n=>n>0?'pos':n<0?'neg':'zero';
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function marketOpen(){if(VIEW)return false;const ist=new Date(Date.now()+(new Date().getTimezoneOffset()*60000)+5.5*3600000);const dow=ist.getDay(),mn=ist.getHours()*60+ist.getMinutes();return dow>=1&&dow<=5&&mn>=555&&mn<=930;}

function cardHTML(c,isCh){
  if(!c||!c.live) return '<div class="card '+(isCh?'ch':'bl')+'"><div class="name">'+esc(c?c.label:'')+'</div><div class="wait">waiting for engine…</div></div>';
  var gate = c.gate_ok!==undefined ? '<span class="gate '+(c.gate_ok?'ok':'bad')+'">'+(c.gate_ok?'gate ok · 0 shorts':'GATE FAIL · '+c.shorts+' shorts')+'</span>' : '';
  var sdate = c.session_date ? '<span class="sdate">'+esc(c.session_date)+'</span>' : '';
  var staleBanner = c.stale ? '<div class="stale-banner">⚠ HISTORICAL SESSION — '+esc(c.session_date)+' (not today)</div>' : '';
  return '<div class="card '+(isCh?'ch':'bl')+(c.stale?' stale':'')+'">'
    +staleBanner
    +'<div class="name">'+esc(c.label)+' '+sdate+' '+gate+'</div>'
    +'<div class="pnl '+cls(c.realized_pnl)+'">'+inr(c.realized_pnl)+'</div>'
    +'<div class="meta"><span>Closed <b>'+c.closed+'</b> · Open <b>'+c.open+'</b></span>'
    +'<span>Win <b>'+(c.win_rate==null?'—':c.win_rate+'%')+'</b></span>'
    +'<span>L/S <b>'+c.longs+'/'+c.shorts+'</b></span>'
    +'<span>Regime <b>'+esc(c.regime||'—')+'</b></span>'
    +'<span>Start <b>'+esc(c.started)+'</b></span></div></div>';
}
function expHTML(e){
  var d=e.delta;
  var mid = (d==null)?'<div class="l">— vs —</div>'
    :'<div class="d '+cls(d)+'">'+inr(d)+'</div><div class="l">A/B − live (day)</div>';
  if(e.cum_delta!=null){  // running A/B total over the shadow period
    mid += '<div class="d '+cls(e.cum_delta)+'" style="font-size:15px;margin-top:6px">'+inr(e.cum_delta)+'</div><div class="l">A/B − live (week)</div>';
  }
  return '<div class="exp"><div class="eh"><span class="et">'+esc(e.title)+'</span>'
    +'<span class="status">'+esc(e.status)+'</span><span class="hyp">▸ '+esc(e.hypothesis)+'</span></div>'
    +'<div class="cmp">'+cardHTML(e.challenger,true)+'<div class="delta">'+mid+'</div>'+cardHTML(e.baseline,false)+'</div></div>';
}
async function loadSessions(){
  try{const r=await fetch('/api/live-dates?limit=7'); const d=await r.json();
    const items=[{date:null,label:'LIVE',live:true}].concat((d.sessions||[]).map(s=>({date:s.date,label:s.date.slice(5),pnl:s.pnl,trades:s.trades})));
    document.getElementById('chips').innerHTML=items.map(c=>
      '<div class="chip '+((c.live&&marketOpen())?'live ':'')+(VIEW===(c.date||null)?'on':'')+'" onclick="selectSession('+(c.date?("'"+c.date+"'"):'null')+')">'
      +'<span class="cd">'+c.label+'</span><span class="cp '+(c.live?'zero':cls(c.pnl))+'">'+(c.live?(marketOpen()?'today':'closed'):(c.trades?inr(c.pnl):'—'))+'</span></div>').join('');
  }catch(e){}
}
function selectSession(date){VIEW=date; loadSessions(); tick();}
async function tick(){
  try{const r=await fetch(apiUrl()); const d=await r.json();
    document.getElementById('exps').innerHTML=(d.experiments||[]).map(expHTML).join('');
    document.getElementById('upd').textContent='last update '+new Date().toTimeString().slice(0,8);
    document.getElementById('date-note').innerHTML = VIEW?('REVIEW <b style="color:var(--amb)">'+VIEW+'</b>'):'';
  }catch(e){console.error(e);}
}
tick(); loadSessions(); setInterval(tick,10000); setInterval(loadSessions,60000);
</script>
</body>
</html>
