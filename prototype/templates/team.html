<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradePilot Terminal · Quant Desk</title>
<link rel="stylesheet" href="/static/desk.css">
<style>
  /* /team on desk.css tokens (2026-09-05 reskin). Also framed inside the
     Terminal's Agent Floor pane with ?embed=1, where the nav is omitted. */
  body{font-variant-numeric:tabular-nums}
  .pagehead{padding:9px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
            background:var(--panel2);flex-wrap:wrap;gap:8px}
  .pagehead h1{font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
  .pagehead .meta{color:var(--mut);font-size:12px}
  main{padding:14px 16px 40px;max-width:1560px;margin:0 auto}
  section{margin-bottom:14px}
  h2{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:0 0 8px;font-weight:700}
  .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .kpi{background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:6px}
  .kpi .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
  .kpi .value{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.3px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .agent-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .agent-card{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px;cursor:pointer;transition:border-color .15s}
  .agent-card:hover{border-color:var(--acc)}
  .agent-card .name{font-weight:650;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .agent-card .status{font-size:11px;color:var(--mut)}
  .agent-card .last{font-size:11px;color:var(--mut);margin-top:6px;max-height:32px;overflow:hidden}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.idle{background:var(--green)}
  .dot.running{background:var(--amber)}
  .dot.blocked{background:var(--red)}
  .dot.warning{background:var(--amber)}
  .dot.scheduled{background:var(--dim)}
  .dot.paged{background:var(--red)}
  .dot.unknown{background:var(--dim)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .feed{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:380px;overflow-y:auto}
  .feed-row{padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;display:grid;grid-template-columns:80px 110px 1fr;gap:8px}
  .feed-row:last-child{border-bottom:none}
  .feed-row .time{color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .feed-row .agent{color:var(--acc)}
  .feed-row .text{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  .audit-row{padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;display:grid;grid-template-columns:70px 90px 80px 1fr;gap:8px}
  .audit-row .time{color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .audit-row .agent{color:var(--acc)}
  .audit-row .text{overflow:hidden;text-overflow:ellipsis}
  .audit-row .decision{font-weight:700;font-size:10px;padding:2px 6px;border-radius:3px;text-align:center;letter-spacing:.6px;align-self:start}
  .audit-row .decision.PASS    {background:var(--green-bg);color:var(--green)}
  .audit-row .decision.WARN    {background:var(--amber-bg);color:var(--amber)}
  .audit-row .decision.BLOCK   {background:var(--red-bg);color:var(--red)}
  .audit-row .decision.REJECT  {background:var(--red-bg);color:var(--red)}
  .audit-row .decision.OVERRIDE{background:var(--acc-bg);color:var(--acc)}
  .audit-row .decision.ESCALATE{background:rgba(236,72,153,.12);color:#f472b6}
  .nav-link{color:var(--acc);text-decoration:none;font-size:12px}
  .nav-link:hover{text-decoration:underline}
  .empty{padding:14px;color:var(--dim);font-size:12px;text-align:left}
  .due-badge{display:inline-block;background:var(--red-bg);color:var(--red);font-size:9px;padding:1px 5px;border-radius:3px;
             margin-left:6px;font-weight:700;letter-spacing:.5px}
  .due-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
  .due-panel .row{font-size:12px;padding:4px 0;color:var(--mut)}
  .due-panel .agent-name{color:var(--amber);font-weight:600}
  @media (max-width:1100px){.kpi-strip{grid-template-columns:repeat(3,1fr)}.agent-grid{grid-template-columns:repeat(3,1fr)}.two-col{grid-template-columns:1fr}}
  @media (max-width:600px){.kpi-strip{grid-template-columns:repeat(2,1fr)}.agent-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
{% set current = 'agents' %}
{% if not embed %}
{% include "_operator_nav.html" %}
<header class="pagehead">
  <h1>TradePilot Quant Desk</h1>
  <div class="meta">
    <span id="ts" class="num">—</span>
    &nbsp;·&nbsp;
    <a class="nav-link" href="/team/sarathi">Sarathi Ledger</a>
    &nbsp;·&nbsp;
    <a class="nav-link" href="/live">Live Engines</a>
  </div>
</header>
{% endif %}
<main>
  <section>
    <h2>KPI · Today</h2>
    <div class="kpi-strip" id="kpi"></div>
  </section>

  <section>
    <h2>Agent Grid · 10 roles</h2>
    <div class="agent-grid" id="agents"></div>
  </section>

  <section>
    <h2>Pending LLM-agent tasks (due markers)</h2>
    <div class="due-panel" id="due"></div>
  </section>

  <section>
    <h2>Activity feed &nbsp;·&nbsp; Audit log</h2>
    <div class="two-col">
      <div class="feed" id="activity"></div>
      <div class="feed" id="audit"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const POLL_MS = 5000;

function fmt(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleTimeString("en-IN", {hour12: false});
}

function makeEl(tag, opts) {
  const el = document.createElement(tag);
  if (!opts) return el;
  if (opts.cls)   el.className = opts.cls;
  if (opts.text)  el.textContent = opts.text;
  if (opts.title) el.title = opts.title;
  if (opts.onClick) el.addEventListener("click", opts.onClick);
  return el;
}

function clear(parent) { while (parent.firstChild) parent.removeChild(parent.firstChild); }

function renderKpi(kpi) {
  const items = [
    ["Audit events", String(kpi.today_audit_total ?? 0)],
    ["Blocks",       String(kpi.today_blocks ?? 0)],
    ["Warns",        String(kpi.today_warns ?? 0)],
    ["Passes",       String(kpi.today_passes ?? 0)],
    ["Sprint",       "1 · S1"],
    ["Target Sharpe","1.5"],
  ];
  const root = document.getElementById("kpi");
  clear(root);
  items.forEach(([l, v]) => {
    const box = makeEl("div", {cls: "kpi"});
    box.appendChild(makeEl("div", {cls: "label", text: l}));
    box.appendChild(makeEl("div", {cls: "value", text: v}));
    root.appendChild(box);
  });
}

function renderAgents(agents, dueSet) {
  const root = document.getElementById("agents");
  clear(root);
  agents.forEach(a => {
    const status = a.status || "unknown";
    const card = makeEl("div", {cls: "agent-card"});
    const nameRow = makeEl("div", {cls: "name"});
    nameRow.appendChild(makeEl("span", {cls: `dot ${status}`}));
    nameRow.appendChild(makeEl("span", {text: a.agent}));
    if (dueSet.has(a.agent)) {
      nameRow.appendChild(makeEl("span", {cls: "due-badge", text: "DUE"}));
    }
    card.appendChild(nameRow);
    card.appendChild(makeEl("div", {cls: "status", text: `${status} · ${fmt(a.ts)}`}));
    const last = a.last_action || "—";
    const next = a.next_due ? ` · next: ${a.next_due}` : "";
    card.appendChild(makeEl("div", {cls: "last", text: `${last}${next}`, title: last}));
    root.appendChild(card);
  });
}

function renderDue(dueList) {
  const root = document.getElementById("due");
  clear(root);
  if (!dueList.length) {
    root.appendChild(makeEl("div", {cls: "empty", text: "No pending LLM-agent tasks."}));
    return;
  }
  dueList.forEach(d => {
    const row = makeEl("div", {cls: "row"});
    row.appendChild(makeEl("span", {cls: "agent-name", text: d.agent}));
    row.appendChild(makeEl("span", {text: " · " + (d.reason || "")}));
    const since = d.marked_at ? " · marked " + fmt(d.marked_at) : "";
    row.appendChild(makeEl("span", {text: since}));
    root.appendChild(row);
  });
}

function renderActivity(rows) {
  const root = document.getElementById("activity");
  clear(root);
  if (!rows.length) {
    root.appendChild(makeEl("div", {cls: "empty", text: "No activity yet."}));
    return;
  }
  rows.forEach(r => {
    const row = makeEl("div", {cls: "feed-row"});
    row.appendChild(makeEl("div", {cls: "time", text: fmt(r.ts)}));
    row.appendChild(makeEl("div", {cls: "agent", text: r.agent || ""}));
    row.appendChild(makeEl("div", {cls: "text", text: r.summary || r.kind || ""}));
    root.appendChild(row);
  });
}

function renderAudit(rows) {
  const root = document.getElementById("audit");
  clear(root);
  if (!rows.length) {
    root.appendChild(makeEl("div", {cls: "empty", text: "No audit entries yet."}));
    return;
  }
  rows.forEach(r => {
    const row = makeEl("div", {cls: "audit-row"});
    row.appendChild(makeEl("div", {cls: "time", text: fmt(r.ts)}));
    row.appendChild(makeEl("div", {cls: `decision ${r.decision}`, text: r.decision}));
    row.appendChild(makeEl("div", {cls: "agent", text: r.agent || ""}));
    const tail = `${r.action || ""} → ${r.subject || ""}${r.reason ? " · " + r.reason : ""}`;
    row.appendChild(makeEl("div", {cls: "text", text: tail, title: tail}));
    root.appendChild(row);
  });
}

async function tick() {
  try {
    const r = await fetch("/api/team/status");
    const j = await r.json();
    var tsEl = document.getElementById("ts");
    if (tsEl) tsEl.textContent = fmt(j.ts);
    const dueList = j.due || [];
    const dueSet = new Set(dueList.map(d => d.agent));
    renderKpi(j.kpi || {});
    renderAgents(j.agents || [], dueSet);
    renderDue(dueList);
    renderActivity(j.activity || []);
    renderAudit(j.audit || []);
  } catch (e) {
    console.error(e);
  }
}

tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
