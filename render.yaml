services:
  - type: web
    name: tradepilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd prototype && gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 2 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
    plan: free
    healthCheckPath: /
    autoDeploy: true
